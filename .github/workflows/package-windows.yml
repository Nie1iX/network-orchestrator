name: Package Windows

# Produces an unsigned NSIS installer artifact. No signing, no publishing.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.98.1-x86_64-pc-windows-msvc
          rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run build
      - name: Build unsigned NSIS bundle
        run: npm run tauri build -- --bundles nsis
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-orchestrator-windows-${{ github.ref_name }}
          path: target/release/bundle/nsis/*
          if-no-files-found: error
