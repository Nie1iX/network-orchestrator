[workspace]
members = ["crates/core", "crates/daemon", "crates/macos-bridge", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Build scripts and proc macros must retain the metadata Rust loads at build time.
[profile.release.build-override]
strip = "none"
