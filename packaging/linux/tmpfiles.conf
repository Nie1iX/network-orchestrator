# Create the managed package root before the daemon starts. With
# ProtectSystem=strict the daemon's ReadWritePaths entry applies only to
# paths that already exist, so xray.install/xray.remove would fail with
# EROFS on a system where the app package did not ship the Xray files.
d /usr/lib/network-orchestrator 0755 root root -
d /usr/lib/network-orchestrator/xray 0755 root root -
