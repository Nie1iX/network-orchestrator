[package]
name = "net-manager-app"
version.workspace = true
description = "Network Orchestrator — unified network interface and VPN management"
authors = []
edition.workspace = true

[lib]
name = "net_manager_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
net-manager-core = { path = "../crates/core" }
tokio = { version = "1", features = ["full"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "=0.13.5", features = ["stream", "socks"] }
futures-util = "=0.3.31"
base64 = "0.22"
sha2 = "=0.10.9"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-autostart = "2"
libc = "0.2"
dbus-secret-service = { version = "4.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
