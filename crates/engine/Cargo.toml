[package]
name = "net-manager-engine"
version = "0.18.1"
edition.workspace = true

[features]
# Builds the Linux daemon client on other hosts so its callers can be tested there.
linux-engine = []

[dependencies]
base64 = "0.22"
ipnet = "2"
net-manager-core = { path = "../core" }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "process", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
sha2 = "=0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework-sys = "=2.17.0"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.1", features = ["crypto-rust"] }
reqwest = { version = "=0.13.5", features = ["stream", "socks"] }

[dev-dependencies]
tempfile = "3"
