[package]
name = "net-manager-engine"
version = "0.10.0"
edition.workspace = true

[features]
# Builds the Linux daemon client on other hosts so its callers can be tested there.
linux-engine = []

[dependencies]
base64 = "0.22"
net-manager-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net"] }

[dev-dependencies]
tempfile = "3"
