[package]
name = "network-orchestrator-macos-helper"
version = "0.10.0"
edition.workspace = true

[[bin]]
name = "network-orchestrator-helper"
path = "src/main.rs"

[lib]
name = "network_orchestrator_macos_helper"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
boringtun = { version = "0.6", default-features = false }
ipnet = "2"
libc = "0.2"
net-manager-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
