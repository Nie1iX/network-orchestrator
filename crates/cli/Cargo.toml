[package]
name = "net-manager-cli"
version.workspace = true
edition.workspace = true
description = "netorch: one command for VPN profiles, tunnels and routing"

[[bin]]
name = "netorch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
libc = "0.2"
plist = "1"
net-manager-core = { path = "../core" }
net-manager-engine = { path = "../engine" }
net-manager-macos-bridge = { path = "../macos-bridge" }
network-orchestrator-macos-helper = { path = "../macos-helper" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"
