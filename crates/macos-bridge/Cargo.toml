[package]
name = "net-manager-macos-bridge"
version = "0.10.0"
edition.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22"
ipnet = "2"
net-manager-core = { path = "../core" }
net-manager-engine = { path = "../engine" }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "process"] }

[dev-dependencies]
tempfile = "3"
